<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>MPEMS - Expense Tracker</title>
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>MPEMS</h1>
    <p>Manual Personal Expense Management System</p>
  </header>
    <main>
    <section id="add-section">
      <h2>Add an Expense</h2>
      <p id="message" role="alert"></p>

      <label for="description">What did you spend on?</label>
      <input type="text" id="description">

      <label for="amount">Amount (KES)</label>
      <input type="number" id="amount">

      <label for="category">Category</label>
      <select id="category">
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Other">Other</option>
      </select>

      <label for="date">Date</label>
      <input type="date" id="date">

      <button id="add-btn">Add Expense</button>
    </section>

    <section id="list-section">
      <h2>My Expenses</h2>
      <p>Total spent: KES <span id="total">0</span></p>
      <ul id="expense-list"></ul>
    </section>
  </main>
  </body>
</html>
